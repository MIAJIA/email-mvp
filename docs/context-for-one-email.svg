<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What goes into the context for one email to Ethan</title><rect width="680" height="460" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="270" y="24" width="370" height="336" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="455" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Context for one email</text><rect x="40" y="70" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="135.0" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Your request</text><text x="135.0" y="108" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">typed now</text><rect x="40" y="146" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="135.0" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Emails to this person</text><text x="135.0" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">46 emails to Ethan</text><rect x="40" y="222" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="135.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Emails of this kind</text><text x="135.0" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">30 scheduling emails</text><rect x="40" y="298" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="135.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Recent news</text><text x="135.0" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">mock, not your emails</text><rect x="290" y="70" width="330" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="455.0" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">What you want to say</text><text x="455.0" y="108" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">coffee Friday, in person, walking group?</text><rect x="290" y="146" width="330" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="455.0" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">About this person</text><text x="455.0" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">&quot;Ethan&quot; · &quot;Best, Mia&quot; · meets at Red Rock</text><rect x="290" y="222" width="330" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="455.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Your style for this kind</text><text x="455.0" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">suggests meeting in person, names a place</text><rect x="290" y="298" width="330" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="455.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Recent context</text><text x="455.0" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">new baby Lily (Instagram, mock)</text><line x1="230" y1="98" x2="288" y2="98" stroke="#7