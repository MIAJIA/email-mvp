<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a preference is learned and updated</title><rect width="680" height="530" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="340.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Your sent emails</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">319 emails</text><rect x="120" y="136" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="220.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Emails to one person</text><text x="220.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">e.g. 46 to Ethan</text><rect x="360" y="136" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="460.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Emails of one kind</text><text x="460.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">e.g. 30 scheduling emails</text><rect x="120" y="232" width="440" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="340.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Find patterns, keep only real quotes</text><text x="340.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">greeting &quot;Ethan&quot; appears in 8 of 46 emails</text><rect x="120" y="328" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="220.0" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Solid underline</text><text x="220.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">3+ emails and over 30%</text><rect x="360" y="328" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/><text x="460.0" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Dashed underline</text><text x="460.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">e.g. &quot;Ethan&quot; at 17%</text><rect x="120" y="424" width="440" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="340.0" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Your feedback on a highlight</text><text x="340.0" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Keep: always solid. Reject: never used again.</text><path d="M340 96 L340 116 L220 116 L220 134" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M340 96 L340 116 L460 116 L460 134" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="220" y1="192" x2="220" y2="230" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="460" y1="192" x2="460" y2="230" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="220" y1="288" x2="220" y2="326" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="460" y1="288" x2="460" y2="326" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="220" y1="384" x2="220" y2="422" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><line x1="460" y1="384" x2="460" y2="422" stroke="#73726c" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="340" y="506" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">↻ saved on that entry, so the next draft follows it</text></svg>
